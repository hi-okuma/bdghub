name: Deploy to Development (Manual)

on:
  push:
    branches:
      - develop-front

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make build script executable
        run: chmod +x ./build_scripts/build_web.sh

      - name: Build for Development
        run: ./build_scripts/build_web.sh dev

      - name: Deploy to Firebase Hosting (Development)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BDGHUB_DEV }}'
          projectId: bdghub-dev
          channelId: live
